<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Eventi & Archivio Storico 2025–2026 | Pro Loco Cavaglio d'Agogna APS</title>
  <meta name="description" content="Tutti gli eventi, le feste patronali, le gite e l'archivio storico 2025–2026 della Pro Loco Cavaglio d'Agogna APS. Locandine ufficiali e dettagli di partecipazione." />
  <link rel="canonical" href="https://www.prolococavaglio.it/eventi.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calendario Eventi & Archivio Storico 2025–2026 | Pro Loco Cavaglio d'Agogna APS" />
  <meta property="og:description" content="Calendario completo degli eventi organizzati dalla Pro Loco di Cavaglio d'Agogna: feste, sapori tipici, gite e serate musicali." />
  <meta property="og:url" content="https://www.prolococavaglio.it/eventi.html" />
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1KVyBhwV7JGch7R4_ysFEVZUoenLvQJXy=w900" />
  <meta property="og:locale" content="it_IT" />

  <!-- Tailwind CSS & Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hill: { DEFAULT: '#6EB34E', dark: '#4F8F33', light: '#E7F5E0' },
            cobalt: { DEFAULT: '#2A4BFF', dark: '#1D37CC', light: '#E8EDFF' },
            sun: { DEFAULT: '#FFD426', dark: '#E5B800', light: '#FFF8D6' },
            coral: { DEFAULT: '#FF5A26', dark: '#E04312', light: '#FFE8E0' },
            paper: { DEFAULT: '#F4F4F1', dark: '#E8E8E3' },
            ink: { DEFAULT: '#18191C', soft: '#3A3D45' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Anton"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Calendario Eventi & Archivio Storico Pro Loco Cavaglio d'Agogna",
    "url": "https://www.prolococavaglio.it/eventi.html",
    "description": "Tutti gli appuntamenti, le sagre e le feste organizzate dalla Pro Loco a Cavaglio d'Agogna.",
    "publisher": {
      "@type": "Organization",
      "name": "Pro Loco Cavaglio d'Agogna APS",
      "url": "https://www.prolococavaglio.it/"
    }
  }
  </script>
</head>
<body data-page="eventi" class="min-h-screen flex flex-col antialiased selection:bg-sun selection:text-ink">

  <!-- BARRA LIVE NEWS & HEADER AUTOMATICI -->
  <div id="site-live-bar"></div>
  <header id="site-header"></header>

  <main class="flex-grow w-full">
    <!-- HERO HEADER SEZIONE -->
    <div class="bg-cobalt text-white py-12 sm:py-16 px-4 sm:px-6">
      <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
          <div>
            <span class="inline-block bg-sun text-ink text-xs font-extrabold uppercase px-3.5 py-1 rounded-full mb-3 tabular-nums">
              Programmazione & Memoria Storica 2025–2026
            </span>
            <h1 class="font-display text-4xl sm:text-6xl uppercase tracking-wide leading-none">
              CALENDARIO EVENTI & ARCHIVIO
            </h1>
            <p class="text-sm sm:text-base text-white/90 max-w-2xl mt-3 leading-relaxed">
              Tutti gli appuntamenti della <strong>Pro Loco Cavaglio d'Agogna APS</strong>: consulta le locandine ufficiali, i programmi gastronomici, le modalità di partecipazione e gli scatti d'archivio.
            </p>
          </div>
          <button onclick="window.downloadPoster('carru-2026')" class="btn-press inline-flex items-center gap-2 bg-sun hover:bg-sun-dark text-ink font-extrabold text-xs sm:text-sm uppercase tracking-wider px-6 py-4 rounded-full shadow-lg transition self-start md:self-auto shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Locandina Gita a Carrù
          </button>
        </div>
      </div>
    </div>

    <!-- CONTENUTO EVENTI CON FILTRI TABULARI -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
      <div class="flex flex-wrap items-center gap-2 mb-8 tabular-nums">
        <button onclick="window.filterEvents('tutti')" data-filter="tutti" class="filter-btn btn-press bg-ink text-white text-xs font-extrabold uppercase tracking-wider px-4 py-2.5 rounded-full transition">
          Tutti gli Eventi (18)
        </button>
        <button onclick="window.filterEvents('upcoming')" data-filter="upcoming" class="filter-btn btn-press bg-white text-ink border border-ink/15 text-xs font-extrabold uppercase tracking-wider px-4 py-2.5 rounded-full transition">
          In Evidenza (2)
        </button>
        <button onclick="window.filterEvents('2026')" data-filter="2026" class="filter-btn btn-press bg-white text-ink border border-ink/15 text-xs font-extrabold uppercase tracking-wider px-4 py-2.5 rounded-full transition">
          Stagione 2026 (12)
        </button>
        <button onclick="window.filterEvents('2025')" data-filter="2025" class="filter-btn btn-press bg-white text-ink border border-ink/15 text-xs font-extrabold uppercase tracking-wider px-4 py-2.5 rounded-full transition">
          Stagione 2025 (6)
        </button>
      </div>

      <!-- Griglia Eventi Completa -->
      <div class="bg-cobalt rounded-[2rem] p-5 sm:p-8">
        <div id="all-events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7 pb-3"></div>
      </div>
    </div>
  </main>

  <!-- MODAL DETTAGLI LOCANDINA EVENTO -->
  <div id="detail-modal" onclick="if(event.target===this) window.closeModal('detail-modal')" class="fixed inset-0 z-50 hidden bg-ink/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-ink/10 max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between border-b border-ink/10 pb-4 mb-5 gap-4">
        <div>
          <span id="det-badge" class="inline-block px-3 py-1 rounded-full text-[11px] font-extrabold uppercase bg-sun text-ink mb-1">Evento</span>
          <h3 id="det-title" class="font-display text-3xl sm:text-4xl uppercase text-ink">Titolo Evento</h3>
          <p id="det-meta" class="text-xs sm:text-sm text-ink/65 font-bold mt-1 tabular-nums">Data • Luogo</p>
        </div>
        <button onclick="window.closeModal('detail-modal')" class="btn-press p-2 rounded-full bg-paper hover:bg-ink/10 text-ink shrink-0 transition" aria-label="Chiudi">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="det-body" class="space-y-5 text-sm text-ink/85"></div>
      <div class="mt-6 pt-4 border-t border-ink/10 flex flex-wrap items-center justify-between gap-2.5">
        <div id="det-extra-actions" class="flex flex-wrap gap-2"></div>
        <div class="flex flex-wrap gap-2.5 ml-auto">
          <button onclick="window.closeModal('detail-modal')" class="btn-press px-4 py-2.5 rounded-full bg-paper font-extrabold text-xs uppercase text-ink">Chiudi</button>
          <button id="det-book-btn" class="px-5 py-2.5 rounded-full bg-[#25D366] hover:bg-[#1EBE5D] text-ink font-extrabold text-xs uppercase shadow transition">
            Prenota su WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER AUTOMATICO -->
  <footer id="site-footer"></footer>

  <!-- SCRIPT MODULARI -->
  <script src="js/layout.js"></script>
  <script src="data/eventi.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
